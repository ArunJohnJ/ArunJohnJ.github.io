<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Static Page with Links</title>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap');

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to right, #ffecd2, #fcb69f);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 10px;
  }

  .page {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    width: 100%;
    max-width: 500px;
    padding: 40px 0;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: #333;
    margin: 0 0 30px;
    text-align: center;
  }

  .container {
    display: flex;
    gap: 30px;
  }

  .box {
    width: 200px;
    height: 100px;
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease-in-out;
    padding: 10px;
  }

  .box:hover:not(.disabled) {
    transform: scale(1.05);
  }

  .active {
    background-color: #4caf50;
    color: white;
    text-decoration: none;
  }

  .disabled {
    background-color: #e0e0e0;
    color: #888;
    cursor: not-allowed;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .container {
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .box {
      width: 90%;
      max-width: 300px;
    }
  }
</style>

</head>
<body>
  <div class="page">
    <h1>Welcome to Youth retreat 2025</h1>
    <div class="container">
      <a href="https://actionbound.com/bound/game-play-around" class="box active">Treasure Hunt</a>
      <div class="box disabled">Kahoot Quiz</div>
      <div class="box disabled">Anonymous Q&A</div>
    </div>
  </div>
</body>
</html>
